[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costcontrol"
version = "0.17.1"
description = "ERP-Cost-Copilot：RAG、评测、FastAPI/Docker、ABC 动因校验与成本强归因"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.scripts]
costcontrol = "costcontrol.cli:main"

[tool.setuptools]
packages = ["costcontrol"]
